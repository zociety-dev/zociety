# Pre-commit hooks for zociety
# Focused on shell scripts, markdown docs, and secret detection

default_stages: [pre-commit]
fail_fast: false

repos:
  # Meta: validate config itself
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

  # Standard file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=2500']
      - id: check-yaml
        files: ^(container/.*\.yml|.*\.yaml)$
      - id: check-executables-have-shebangs

  # Secret detection (gitleaks). Uses the binary installed in the container
  # (container/Containerfile); on the host: brew install gitleaks.
  # Config: .gitleaks.toml (extends the default ruleset).
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secret detection)
        entry: gitleaks git --pre-commit --staged --redact --verbose
        language: system
        pass_filenames: false
        stages: [pre-commit]

  # Shell script validation (uses shellcheck from container)
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: ^(bin/.*|container/.*\.sh)$
        args: ['--severity=warning']

  # Zociety-specific: custom format validation
  - repo: local
    hooks:
      - id: no-main-commits
        name: Prevent direct main commits
        entry: .githooks/pre-commit
        language: script
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      - id: validate-zociety-state
        name: Validate zociety state
        entry: bin/validate-state
        language: script
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      # Dev-session attribution: "Agent: claude-code" trailer when CLAUDECODE
      # is set (.githooks/prepare-commit-msg). pre-commit passes the message
      # file as the filename for this stage; needs
      # `pre-commit install --hook-type prepare-commit-msg` (bin/setup).
      - id: agent-trailer
        name: Agent trailer for coding-agent sessions
        entry: .githooks/prepare-commit-msg
        language: script
        stages: [prepare-commit-msg]
        always_run: true
